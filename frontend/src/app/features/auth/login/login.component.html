<div class="auth-container">
  <div class="card">
    <div class="header">
      <span class="app-title">CONTROL DE GASTOS</span>
      <h1>Iniciar sesión</h1>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error" role="alert">
      {{ errorMessage }}
    </div>

    <!-- FORMULARIO TRADICIONAL 100% INTACTO -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" aria-label="Formulario de inicio de sesión">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="usuario@ejemplo.com"
          autocomplete="email"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">El correo electrónico es obligatorio.</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Ingresa un correo electrónico válido.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          autocomplete="current-password"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          <span>La contraseña es obligatoria.</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading || googleLoading">
        {{ loading && !googleLoading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
    </form>

    <!-- SEPARADOR / DIVISOR -->
    <div class="auth-divider">
      <span class="divider-line"></span>
      <span class="divider-text">o continuar con</span>
      <span class="divider-line"></span>
    </div>

    <!-- OPCIÓN DE GOOGLE (ABAJO DEL CORREO Y CONTRASEÑA) -->
    <div class="google-auth-section">
      <button 
        type="button" 
        class="google-custom-btn" 
        (click)="loginWithGoogle()" 
        [disabled]="loading || googleLoading"
        aria-label="Iniciar sesión con Google"
      >
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span *ngIf="!googleLoading">Iniciar sesión con Google</span>
        <span *ngIf="googleLoading">Conectando con Google...</span>
      </button>
    </div>

    <div class="footer">
      <p>¿No tienes una cuenta? <a routerLink="/register">Crear cuenta</a></p>
    </div>
  </div>
</div>
